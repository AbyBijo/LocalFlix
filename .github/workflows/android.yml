name: Android

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # Do NOT use android-actions/setup-android: on ubuntu-latest runners
      # it fails with "Failed to find package 'tools'". The runner already
      # has an Android SDK at $ANDROID_HOME, so use it directly and install
      # only the packages this app needs.
      - name: Install Android 36
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          elif [ -x "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" ]; then
            SDKMGR="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          else
            SDKMGR="sdkmanager"
          fi
          yes | "$SDKMGR" --licenses || true
          yes | "$SDKMGR" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: localflix-debug-apk
          path: app/build/outputs/apk/debug/*.apk
